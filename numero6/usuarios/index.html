<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Chat</title>

    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );
        }


        /* =========================
           CAJA PRINCIPAL DEL CHAT
        ========================= */

        .chat {
            width: 420px;
            height: 650px;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4);

            display: flex;
            flex-direction: column;
        }


        /* =========================
           ENCABEZADO
        ========================= */

        .chat-header {
            background: #2563eb;

            color: white;

            padding: 20px;

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .avatar {
            width: 45px;
            height: 45px;

            background: white;

            color: #2563eb;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 22px;
        }


        .chat-header h2 {
            font-size: 18px;
        }


        .chat-header span {
            font-size: 12px;

            opacity: 0.85;
        }


        /* =========================
           ÁREA DE MENSAJES
        ========================= */

        .messages {
            flex: 1;

            padding: 20px;

            background: #f1f5f9;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        /* =========================
           MENSAJE GENERAL
        ========================= */

        .message {
            max-width: 75%;

            padding: 12px 16px;

            border-radius: 18px;

            font-size: 14px;

            line-height: 1.4;

            word-wrap: break-word;
        }


        /* =========================
           MENSAJE RECIBIDO
        ========================= */

        .received {
            align-self: flex-start;

            background: white;

            color: #1e293b;

            border-bottom-left-radius: 5px;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           MENSAJE ENVIADO
        ========================= */

        .sent {
            align-self: flex-end;

            background: #2563eb;

            color: white;

            border-bottom-right-radius: 5px;
        }


        /* =========================
           ÁREA PARA ESCRIBIR
        ========================= */

        .input-area {
            background: white;

            padding: 15px;

            border-top: 1px solid #e2e8f0;

            display: flex;

            gap: 10px;
        }


        /* =========================
           INPUT
        ========================= */

        .input-area input {
            flex: 1;

            border: 1px solid #cbd5e1;

            border-radius: 25px;

            padding: 13px 18px;

            font-size: 14px;

            outline: none;
        }


        .input-area input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.1);
        }


        /* =========================
           BOTÓN ENVIAR
        ========================= */

        .input-area button {
            width: 45px;

            height: 45px;

            border: none;

            border-radius: 50%;

            background: #2563eb;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s;
        }


        .input-area button:hover {
            background: #1d4ed8;

            transform: scale(1.08);
        }


        /* =========================
           SCROLL
        ========================= */

        .messages::-webkit-scrollbar {
            width: 6px;
        }


        .messages::-webkit-scrollbar-thumb {
            background: #94a3b8;

            border-radius: 10px;
        }


        /* =========================
           CELULARES
        ========================= */

        @media (max-width: 500px) {

            .chat {
                width: 95%;

                height: 90vh;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         CHAT
    ========================= -->

    <div class="chat">


        <!-- ENCABEZADO -->

        <div class="chat-header">

            <div class="avatar">
                💬
            </div>

            <div>

                <h2>
                    Mi Chat
                </h2>

                <span>
                    ● En línea
                </span>

            </div>

        </div>


        <!-- =========================
             MENSAJES
        ========================= -->

        <div
            class="messages"
            id="messages"
        >

        </div>


        <!-- =========================
             FORMULARIO
        ========================= -->

        <form
            class="input-area"
            id="form"
        >

            <input
                id="input"
                type="text"
                autocomplete="off"
                placeholder="Escribe un mensaje..."
            >

            <button
                type="submit"
            >
                ➤
            </button>

        </form>


    </div>


    <!-- =========================
         SOCKET.IO
    ========================= -->

    <script type="module">

        import { io } from
        "https://cdn.socket.io/4.3.2/socket.io.esm.min.js";


        // Conectar con el servidor

        const socket = io();


        // Obtener elementos del HTML

        const form =
            document.getElementById("form");

        const input =
            document.getElementById("input");

        const messages =
            document.getElementById("messages");


        // =========================
        // ENVIAR MENSAJE
        // =========================

        form.addEventListener(
            "submit",
            (event) => {

                event.preventDefault();


                const mensaje =
                    input.value.trim();


                // No enviar mensajes vacíos

                if (mensaje === "") {
                    return;
                }


                // Mandar mensaje al servidor

                socket.emit(
                    "chat message",
                    mensaje
                );


                // Limpiar input

                input.value = "";


                // Regresar el cursor al input

                input.focus();

            }
        );


        // =========================
        // RECIBIR MENSAJE
        // =========================

        socket.on(
            "chat message",
            (data) => {


                // Crear elemento

                const item =
                    document.createElement("div");


                // Clase general

                item.classList.add(
                    "message"
                );


                // Comprobar quién envió
                // el mensaje

                if (
                    data.sender === socket.id
                ) {

                    // MI MENSAJE

                    item.classList.add(
                        "sent"
                    );

                } else {

                    // MENSAJE RECIBIDO

                    item.classList.add(
                        "received"
                    );

                }


                // Colocar texto

                item.textContent =
                    data.message;


                // Agregar al chat

                messages.appendChild(
                    item
                );


                // Bajar automáticamente
                // al último mensaje

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );


        // =========================
        // CONEXIÓN
        // =========================

        socket.on(
            "connect",
            () => {

                console.log(
                    "Conectado al servidor"
                );

            }
        );


        // =========================
        // DESCONEXIÓN
        // =========================

        socket.on(
            "disconnect",
            () => {

                console.log(
                    "Desconectado del servidor"
                );

            }
        );

    </script>


</body>

</html>
